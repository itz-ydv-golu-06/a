<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanskar Grand - KOT Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  /* Dark theme is the default */
  :root {
    --paper: #17130F;
    --paper-raised: #241E17;
    --surface: #2B241C;
    --ink: #F1E9DA;
    --ink-soft: #A69884;
    --teal: #2FA491;
    --teal-deep: #0E2B26;
    --teal-tint: #17332E;
    --gold: #D9AA5E;
    --line: #3C332A;
    --brick: #E2695A;
    --brick-soft: #3A211D;
    --danger-border: #6B3A34;
    --edit-border: #2E5A52;
    --grain: rgba(255,255,255,0.035);
    --heading: #5FCDB5;
  }

  :root[data-theme="light"] {
    --paper: #F6EFDD;
    --paper-raised: #FFFCF4;
    --surface: #FFFFFF;
    --ink: #2B2420;
    --ink-soft: #7C7261;
    --teal: #1B6459;
    --teal-deep: #103F38;
    --teal-tint: #E4F0EC;
    --gold: #B3873E;
    --line: #E4D8BE;
    --brick: #A84332;
    --brick-soft: #F5E1DA;
    --danger-border: #E3B6B6;
    --edit-border: #A9D3CE;
    --grain: rgba(43,36,32,0.05);
    --heading: #103F38;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes pulseOnce { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    margin: 0; padding: 0;
    background-color: var(--paper);
    background-image: radial-gradient(circle at 1px 1px, var(--grain) 1px, transparent 0);
    background-size: 22px 22px;
    color: var(--ink);
    transition: background-color .25s ease, color .25s ease;
  }

  .theme-toggle {
    position: fixed;
    top: 14px; right: 14px;
    width: 38px; height: 38px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 400;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: border-color .15s ease;
  }
  .theme-toggle:hover { border-color: var(--gold); }
  .theme-toggle:active svg { transform: rotate(20deg) scale(0.9); }

  .btn { transition: background-color .15s ease, color .15s ease, border-color .15s ease, transform .1s ease; }
  .btn:active { transform: scale(0.96); }

  .app { max-width: 700px; margin: 0 auto; padding: 18px 16px; }

  .brand { text-align: center; margin-bottom: 6px; animation: popIn .35s ease; }
  .brand .emblem {
    width: 46px; height: 46px; margin: 0 auto 8px auto;
    border-radius: 50%; border: 1.5px solid var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 17px;
    color: var(--gold); background: var(--paper-raised);
    box-shadow: 0 0 0 4px var(--paper), 0 1px 3px rgba(43,36,32,0.15);
  }
  .brand .name { font-family: 'Fraunces', serif; font-size: 23px; font-weight: 600; letter-spacing: 0.03em; color: var(--heading); }
  .brand .sub { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em; margin-top: 2px; }

  #syncStatus { display: block; text-align: center; font-size: 11px; color: var(--ink-soft); margin: 6px 0 16px 0; }
  #syncStatus .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); display: inline-block; margin-right: 5px; }
  #syncStatus .dot.err { background: var(--brick); }
  #syncStatus .dot.pending { background: var(--gold); animation: pulseOnce 1.2s ease-in-out infinite; }

  .panel {
    background: var(--paper-raised); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; margin-bottom: 14px;
    box-shadow: 0 1px 2px rgba(43,36,32,0.05);
    animation: popIn .3s ease;
  }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
  .toolbar input[type="text"] {
    flex: 1; min-width: 160px; padding: 9px 10px; font-size: 14px;
    font-family: inherit; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  }
  .toolbar select {
    padding: 9px 10px; font-size: 14px; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
  }
  .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-tint); }

  .summary { font-size: 13px; color: var(--ink-soft); margin-bottom: 12px; }

  .btn {
    padding: 10px 16px; font-size: 14px; font-weight: 700;
    font-family: 'Inter', sans-serif; border: none; border-radius: 8px; cursor: pointer;
  }
  .btn-primary { background: var(--gold); color: #241C0F; }
  .btn-primary:hover { background: #C4954A; }
  .btn-ghost { background: transparent; color: var(--heading); border: 1.5px solid var(--line); }
  .btn-ghost:hover { border-color: var(--teal); }

  .entry {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px; animation: popIn .2s ease;
  }
  .entry .e-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .entry .e-type {
    display: inline-block; font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .04em; padding: 2px 7px; border-radius: 999px;
    background: var(--teal-tint); color: var(--heading); margin-right: 6px;
  }
  .entry .e-meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }
  .entry .e-items { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
  .e-chip {
    font-family: 'JetBrains Mono', monospace; font-size: 11.5px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 9px; color: var(--ink);
  }
  .entry .e-remarks { font-size: 12px; color: var(--brick); background: var(--brick-soft); border-radius: 6px; padding: 5px 8px; margin-top: 6px; }
  .entry .e-actions { display: flex; gap: 8px; margin-top: 8px; }
  .e-actions button {
    font-size: 12px; font-family: 'Inter', sans-serif; padding: 5px 10px;
    border-radius: 6px; border: 1px solid var(--line); background: var(--paper); cursor: pointer;
  }
  .e-actions button.danger { color: var(--brick); border-color: var(--danger-border); }
  .e-actions button.edit { color: var(--heading); border-color: var(--edit-border); }

  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px 0; }
  .footer-actions { text-align: center; margin-top: 10px; }

  #passwordOverlay, #editOverlay {
    display: none; position: fixed; inset: 0;
    background: rgba(20,16,10,0.55); z-index: 300;
    align-items: center; justify-content: center; padding: 16px;
  }
  #passwordOverlay.show, #editOverlay.show { display: flex; animation: fadeIn .18s ease; }

  .small-panel {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; max-width: 340px; width: 100%; animation: popIn .22s cubic-bezier(.34,1.56,.64,1);
  }
  .small-panel h3 { font-family: 'Fraunces', serif; margin: 0 0 12px 0; font-size: 17px; font-weight: 600; color: var(--heading); }
  .small-panel input[type="password"], .small-panel input[type="text"] {
    width: 100%; padding: 10px 11px; font-size: 15px; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 8px; margin-bottom: 10px;
    background: var(--surface); color: var(--ink);
  }
  .small-panel input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-tint); }
  .small-panel .err { color: var(--brick); font-size: 12px; margin: -4px 0 10px 0; display: none; }
  .small-panel .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

  .edit-panel {
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; max-width: 420px; width: 100%; max-height: 85vh; overflow-y: auto;
    animation: popIn .22s cubic-bezier(.34,1.56,.64,1);
  }
  .edit-panel h3 { font-family: 'Fraunces', serif; margin: 0 0 12px 0; font-size: 16px; font-weight: 600; color: var(--heading); }
  .edit-panel label {
    display: block; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 5px;
  }
  .edit-panel input[type="text"], .edit-panel select, .edit-panel textarea {
    width: 100%; padding: 9px 10px; font-size: 15px; font-family: inherit;
    border: 1.5px solid var(--line); border-radius: 8px; margin-bottom: 10px;
    background: var(--surface); color: var(--ink);
  }
  .edit-panel textarea { resize: vertical; min-height: 44px; }
  .edit-item-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); gap: 8px; }
  .edit-item-row .item-name { font-size: 13px; flex: 1; }
  .qty-control { display: flex; align-items: center; gap: 0; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); padding: 2px; }
  .qty-control button { width: 28px; height: 28px; border-radius: 50%; border: none; background: transparent; font-size: 16px; font-weight: 700; cursor: pointer; color: var(--teal); font-family: 'JetBrains Mono', monospace; }
  .qty-control input { width: 34px; text-align: center; font-size: 14px; font-weight: 700; font-family: 'JetBrains Mono', monospace; padding: 4px 0; border: none; background: transparent; color: var(--ink); }
  .qty-control input:focus { outline: none; }
</style>
<script>
  (function() {
    var saved = localStorage.getItem('sanskarKotTheme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
</head>
<body>

<button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" aria-label="Toggle dark/light mode">
  <svg id="themeToggleIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
</button>

<div class="app">
  <div class="brand">
    <div class="emblem">SG</div>
    <div class="name">Sanskar Grand</div>
    <div class="sub">BY MAAN · KOT LOG</div>
  </div>
  <span id="syncStatus"><span class="dot pending"></span>Connecting…</span>

  <div class="panel">
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Search room/table, steward, or item...">
      <select id="typeFilter">
        <option value="">All Types</option>
        <option value="room">Room Service</option>
        <option value="restaurant">Restaurant</option>
      </select>
      <select id="dateFilter">
        <option value="">All dates</option>
        <option value="today">Today only</option>
      </select>
    </div>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
    <div class="footer-actions">
      <button class="btn btn-ghost" onclick="requestUnlock('clearAll', null)">Clear All Log</button>
    </div>
  </div>
</div>

<div id="passwordOverlay">
  <div class="small-panel">
    <h3>Enter Password to Continue</h3>
    <input type="password" id="pwInput" placeholder="Password" autocomplete="off">
    <div class="err" id="pwError">Incorrect password. Try again.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closePasswordModal()">Cancel</button>
      <button class="btn btn-primary" onclick="checkPassword()">Confirm</button>
    </div>
  </div>
</div>

<div id="editOverlay">
  <div class="edit-panel">
    <h3 id="editHeader">Edit KOT</h3>
    <label id="editRoomFieldLabel">Room No.</label>
    <input type="text" id="editRoomNo">
    <label>Steward</label>
    <select id="editSteward">
      <option>Tulasha</option>
      <option>Arpit</option>
      <option>Sohan</option>
    </select>
    <div id="editItemsList"></div>
    <label style="margin-top:10px;">Remarks for Chef</label>
    <textarea id="editRemarks" rows="2" placeholder="e.g. less spicy, no onion..."></textarea>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
    </div>
  </div>
</div>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const KOT_COLLECTION = 'kotHistory';
const EDIT_PASSWORD = 'Sanskar@5656';
let historyCache = [];
let pendingAction = null;
let editingId = null;

function setSyncStatus(text, state) {
  document.getElementById('syncStatus').innerHTML = `<span class="dot ${state || ''}"></span>${text}`;
}

firebase.auth().signInAnonymously().catch(err => {
  console.error('Anonymous sign-in failed:', err);
  setSyncStatus('Sync error — check Firebase setup', 'err');
});

firebase.auth().onAuthStateChanged(user => {
  if (!user) return;
  setSyncStatus('Synced');
  db.collection(KOT_COLLECTION).orderBy('createdAt', 'desc')
    .onSnapshot(snapshot => {
      historyCache = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, err => {
      console.error('History sync error:', err);
      setSyncStatus('Sync error — check Firestore rules', 'err');
    });
});

function render() {
  const todayStr = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
  const term = document.getElementById('searchBox').value.toLowerCase().trim();
  const typeFilter = document.getElementById('typeFilter').value;
  const dateFilter = document.getElementById('dateFilter').value;

  let filtered = historyCache;
  if (dateFilter === 'today') filtered = filtered.filter(h => h.date === todayStr);
  if (typeFilter) filtered = filtered.filter(h => (h.type || 'room') === typeFilter);
  if (term) {
    filtered = filtered.filter(h =>
      h.room.toLowerCase().includes(term) ||
      h.steward.toLowerCase().includes(term) ||
      h.items.some(i => i.name.toLowerCase().includes(term))
    );
  }

  const todaysCount = historyCache.filter(h => h.date === todayStr).length;
  document.getElementById('summary').textContent =
    todaysCount + ' KOT' + (todaysCount === 1 ? '' : 's') + ' today (' + todayStr + ') · ' +
    historyCache.length + ' total · showing ' + filtered.length;

  const listEl = document.getElementById('list');
  listEl.innerHTML = '';

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty">No KOTs found.</div>';
    return;
  }

  filtered.forEach(entry => {
    const type = entry.type || 'room';
    const typeLabel = type === 'restaurant' ? 'Restaurant' : 'Room Service';
    const placeLabel = type === 'restaurant' ? 'Table' : 'Room';
    const chips = entry.items.map(i => `<span class="e-chip">${i.name} ×${i.qty}</span>`).join('');
    const remarksHtml = entry.remarks ? `<div class="e-remarks">Remarks: ${entry.remarks}</div>` : '';
    const div = document.createElement('div');
    div.className = 'entry';
    div.innerHTML = `
      <div class="e-top"><span><span class="e-type">${typeLabel}</span>${placeLabel} ${entry.room}</span><span>${entry.date} · ${entry.time}</span></div>
      <div class="e-meta">Steward: ${entry.steward}</div>
      <div class="e-items">${chips}</div>
      ${remarksHtml}
      <div class="e-actions">
        <button class="edit" onclick="requestUnlock('edit', '${entry.id}')">✏️ Edit</button>
        <button class="danger" onclick="requestUnlock('delete', '${entry.id}')">🗑️ Delete</button>
      </div>`;
    listEl.appendChild(div);
  });
}

document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('dateFilter').addEventListener('change', render);

/* ===== Password gate ===== */
function requestUnlock(type, id) {
  pendingAction = { type, id };
  document.getElementById('pwInput').value = '';
  document.getElementById('pwError').style.display = 'none';
  document.getElementById('passwordOverlay').classList.add('show');
  setTimeout(() => document.getElementById('pwInput').focus(), 50);
}

function closePasswordModal() {
  pendingAction = null;
  document.getElementById('passwordOverlay').classList.remove('show');
}

function checkPassword() {
  const val = document.getElementById('pwInput').value;
  if (val !== EDIT_PASSWORD) {
    document.getElementById('pwError').style.display = 'block';
    return;
  }
  document.getElementById('passwordOverlay').classList.remove('show');
  if (!pendingAction) return;

  if (pendingAction.type === 'delete') performDelete(pendingAction.id);
  else if (pendingAction.type === 'edit') openEditModal(pendingAction.id);
  else if (pendingAction.type === 'clearAll') performClearAll();

  pendingAction = null;
}

document.getElementById('pwInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPassword();
});

function performDelete(id) {
  db.collection(KOT_COLLECTION).doc(id).delete().catch(err => {
    console.error('Delete failed:', err);
    alert('Could not delete this entry. Check your internet connection.');
  });
}

function performClearAll() {
  if (!confirm('Clear the entire KOT log? This cannot be undone.')) return;
  Promise.all(historyCache.map(entry => db.collection(KOT_COLLECTION).doc(entry.id).delete()))
    .catch(err => {
      console.error('Clear all failed:', err);
      alert('Some entries could not be deleted. Check your internet connection and try again.');
    });
}

/* ===== Edit ===== */
function openEditModal(id) {
  const entry = historyCache.find(h => h.id === id);
  if (!entry) return;
  editingId = id;

  const type = entry.type || 'room';
  const placeLabel = type === 'restaurant' ? 'Table' : 'Room';
  document.getElementById('editHeader').textContent = `Edit KOT — ${placeLabel} ${entry.room}`;
  document.getElementById('editRoomFieldLabel').textContent = type === 'restaurant' ? 'Table No.' : 'Room No.';
  document.getElementById('editRoomNo').value = entry.room;
  document.getElementById('editSteward').value = entry.steward;
  document.getElementById('editRemarks').value = entry.remarks || '';

  const listEl = document.getElementById('editItemsList');
  listEl.innerHTML = '';
  entry.items.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'edit-item-row';
    row.innerHTML = `
      <span class="item-name">${item.name}</span>
      <div class="qty-control">
        <button onclick="editQtyChange(${i}, -1)">−</button>
        <input type="number" min="0" value="${item.qty}" id="edit-qty-${i}"
               onchange="editQtySet(${i}, this.value)">
        <button onclick="editQtyChange(${i}, 1)">+</button>
      </div>`;
    listEl.appendChild(row);
  });

  document.getElementById('editOverlay').classList.add('show');
}

function editQtyChange(i, delta) {
  const input = document.getElementById('edit-qty-' + i);
  let v = Math.max(0, parseInt(input.value || '0', 10) + delta);
  input.value = v;
}

function editQtySet(i, val) {
  let v = parseInt(val, 10);
  if (isNaN(v) || v < 0) v = 0;
  document.getElementById('edit-qty-' + i).value = v;
}

function closeEditModal() {
  document.getElementById('editOverlay').classList.remove('show');
  editingId = null;
}

function saveEdit() {
  if (!editingId) return;
  const entry = historyCache.find(h => h.id === editingId);
  if (!entry) return;

  const newRoom = document.getElementById('editRoomNo').value.trim();
  const newSteward = document.getElementById('editSteward').value;
  const newRemarks = document.getElementById('editRemarks').value.trim();
  if (!newRoom) { alert('This field cannot be empty.'); return; }

  const newItems = entry.items.map((item, i) => {
    const val = parseInt(document.getElementById('edit-qty-' + i).value, 10) || 0;
    return { name: item.name, qty: val };
  }).filter(item => item.qty > 0);

  if (newItems.length === 0) {
    if (!confirm('All items set to 0 — this will delete the KOT entry. Continue?')) return;
    performDelete(editingId);
    closeEditModal();
    return;
  }

  db.collection(KOT_COLLECTION).doc(editingId).update({
    room: newRoom,
    steward: newSteward,
    items: newItems,
    remarks: newRemarks
  }).catch(err => {
    console.error('Update failed:', err);
    alert('Could not save changes. Check your internet connection.');
  });

  closeEditModal();
}

/* ===== Theme (dark default, shared preference with smart-kot.html) ===== */
const SUN_ICON = '<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line>';
const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('sanskarKotTheme', theme);
  document.getElementById('themeToggleIcon').innerHTML = theme === 'dark' ? SUN_ICON : MOON_ICON;
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  applyTheme(current === 'dark' ? 'light' : 'dark');
}

applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
</script>

</body>
</html>
